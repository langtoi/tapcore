# Build TapCore on a macOS runner and publish it to the Sileo repo in docs/.
#
# Every push to main that touches the code builds a new .deb, refreshes docs/
# (served by GitHub Pages at https://langtoi.github.io/tapcore/) and commits it back.
# If VERSION was not bumped, the patch number is increased automatically.
name: Build & publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tweak/**'
      - 'app/**'
      - 'web/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'entitlements.plist'
      - 'build.sh'
      - 'tools/make_repo.sh'
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ldid, dpkg, xz
        run: brew install ldid dpkg xz

      - name: Fetch iPhoneOS16.5 SDK (theos/sdks)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          echo "TAPCORE_SDK=$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Choose version
        id: version
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          if [ -f "docs/debs/com.tapcore_${v}_iphoneos-arm64.deb" ]; then
            IFS=. read -r major minor patch <<< "$v"
            v="${major}.${minor:-0}.$(( ${patch:-0} + 1 ))"
            echo "$v" > VERSION
            echo "VERSION was already published, bumped to $v"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash build.sh

      - name: Refresh Sileo repo
        run: bash tools/make_repo.sh

      - name: Commit release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION docs
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "Release TapCore $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
